<div class="content">
  @if (isLoading()) {
    <div class="loading-state">
      <app-spinner></app-spinner>
      <p>Loading data...</p>
    </div>
  }

  @if (errorMessage()) {
    <div class="error-state">
      {{ errorMessage() }}
    </div>
  }

  @if (!isLoading() && wallet(); as w) {
    <div class="card">
      <h2>My Wallet</h2>
      <div class="balance-block">
        <span class="label">Available balance:</span>
        <span class="amount">{{ w.availableBalance }} {{ w.currency }}</span>
      </div>
      <div class="balance-block held">
        <span class="label">On hold:</span>
        <span class="amount">{{ w.heldAmount }} {{ w.currency }}</span>
      </div>
      <div class="actions-section">
        <div class="input-group">
          <!-- Використовуємо ngModel для двостороннього зв'язування з сигналом -->
          <input 
            type="number" 
            placeholder="Amount" 
            [ngModel]="depositAmount()" 
            (ngModelChange)="depositAmount.set($event)"
            [disabled]="isProcessing()"
          />
          <span class="currency-label">{{ w.currency }}</span>
        </div>
        <button 
          class="btn-primary" 
          (click)="onDeposit()" 
          [disabled]="isProcessing() || !depositAmount() || depositAmount()! <= 0">
          @if (isProcessing()) {
            Processing...
          } @else {
            Deposit
          }
        </button>
      </div>
    </div>
  }
</div>
