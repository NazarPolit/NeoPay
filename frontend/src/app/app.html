<div class="wallet-container">
  <header class="header">
    <h1>NeoPay</h1>
    <p>Your financial hub</p>
  </header>

  <main class="content">
    <!-- Loading state -->
    @if (isLoading()) {
      <div class="loading">
        <div class="spinner"></div>
        <p>Loading data...</p>
      </div>
    }

    <!-- Error state -->
    @if (errorMessage()) {
      <div class="error">
        {{ errorMessage() }}
      </div>
    }

    <!-- Wallet card -->
    @if (!isLoading() && wallet(); as w) {
      <div class="card">
        <h2>My Wallet</h2>
        
        <div class="balance-block">
          <span class="label">Available balance:</span>
          <span class="amount">{{ w.availableBalance }} {{ w.currency }}</span>
        </div>

        <div class="balance-block held">
          <span class="label">On hold:</span>
          <span class="amount">{{ w.heldAmount }} {{ w.currency }}</span>
        </div>
      </div>
    }
  </main>
</div>
